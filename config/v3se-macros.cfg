# =============================================================
# ENDER-3 V3 SE STRAIN GAUGE / AUTO-Z MACROS
# =============================================================
#
# This file is included directly by printer.cfg:
#
#   [include v3se-macros.cfg]
#
# The macros defined here are registered normally with Klipper
# and appear in Mainsail like macros defined directly in printer.cfg.
#
# Do NOT duplicate these macros in macro.cfg or printer.cfg.
#
# CR Touch remains the normal homing and bed-mesh probe.
# This file contains the strain-gauge / Auto-Z front-end macros.
#
# Low-level STRAIN_GAUGE_* commands remain available directly
# from the Mainsail console for diagnostics.

[gcode_macro AUTO_Z]
description: Full automatic Z offset calibration using CR Touch and strain gauge
gcode:
    STRAIN_GAUGE_AUTO_Z

[gcode_macro READ_LOAD_SENSOR]
description: Read current force from HX711 sensor
gcode:
    STRAIN_GAUGE_READ

[gcode_macro TARE_LOAD_SENSOR]
description: Tare the HX711 load sensor
gcode:
    STRAIN_GAUGE_TARE

[gcode_macro MESH_LEVEL]
description: Heat bed and perform CR Touch bed mesh calibration
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    M140 S{BED_TEMP}
    G28
    M190 S{BED_TEMP}
    G28 Z
    BED_MESH_CALIBRATE
    G1 X110 Y110 Z10 F6000
    M140 S0

[gcode_macro FULL_CALIBRATE]
description: Full Creality-style Auto Z and bed mesh calibration
gcode:
    AUTO_Z
    M104 S0
    M107
    G28 Z
    BED_MESH_CALIBRATE
    G1 X110 Y110 Z10 F6000
    M140 S0
