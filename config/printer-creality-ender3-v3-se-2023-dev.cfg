# Creality Ender-3 V3 SE - REGULAR KLIPPER PORT DEVELOPMENT PROFILE
#
# Step 2D development/A-B profile.
#
# Source hardware configuration was extracted from the validated working
# V3 SE configuration on 2026-11-01.
#
# IMPORTANT:
# - This is not yet the final community profile.
# - PRTouch algorithm defaults are intentionally explicit and config-driven.
# - HX711 calibration, CR Touch z_offset, and PID values in this development
#   profile belong to the current validation printer.
# - Stock Ender-3 V3 SE display support is intentionally NOT enabled yet.
#   The regular-Klipper serial-bridge/display port is a later step.
#
# Firmware target used by the validated machine:
#   STM32F103
#   28KiB bootloader
#   USART1 PA10/PA9
#
# This regular-Klipper branch contains MCU-affecting PRTouch changes.
# Host and mainboard firmware must come from the same source revision.
#
# Calibration workflow:
#   AUTO_Z
#   FULL_CALIBRATE
#
[include v3se-macros.cfg]

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 64
rotation_distance: 40  # Calibrate using: new_rotation_distance = current_rotation_distance * actual_distance / commanded_distance
endstop_pin: !PA5
position_endstop: -14
position_min: -14
position_max: 220
homing_speed: 50


[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 64
rotation_distance: 40  # Calibrate using: new_rotation_distance = current_rotation_distance * actual_distance / commanded_distance
endstop_pin: !PA6
position_endstop: -14
position_min: -14
position_max: 230
homing_speed: 50


[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 4
second_homing_speed: 1
homing_retract_dist: 2.0


[extruder]
max_extrude_only_distance: 100.0
# pressure_advance: 0.101  # Old donor value, not yet calibrated
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.67  # Old value. Verify by measuring commanded vs actual filament extrusion before final tuning.
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 270

control: pid
pid_Kp: 25.636
pid_Ki: 1.411
pid_Kd: 116.485


[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 115

control: pid
pid_Kp: 31.497
pid_Ki: 0.311
pid_Kd: 796.474


[heater_fan hotend_fan]
pin: PC1
max_power: 1.0
shutdown_speed : 0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0
heater:extruder
heater_temp : 50
fan_speed : 1.0


[fan]
pin: PA0


[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000
#serial: /dev/ttyUSB2
restart_method: command

#[mcu rpi]
#serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
#baud: 250000

#[mpu9250]
#i2c_mcu: rpi
#i2c_bus: i2c.1

#[resonance_tester]
#accel_chip: mpu9250
#probe_points:
#    100, 100, 20


[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 1900
#max_accel_to_decel: 3000
max_z_velocity: 50
square_corner_velocity: 5.0
max_z_accel: 500


[bltouch]
sensor_pin: ^PC14
control_pin: PC13
x_offset: -24.0
y_offset: -20.0
speed: 7
samples: 2
sample_retract_dist: 3.0
samples_tolerance: 0.05
samples_tolerance_retries: 3


# Development A/B value from the known-good test printer.
# Final community installs must calibrate their own Z offset.
z_offset: 1.390


[safe_z_home]
home_xy_position: 134, 130  # CR Touch positioned at the center of the bed
speed: 100
z_hop: 10
z_hop_speed: 10


[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 190, 200
probe_count: 5, 5
mesh_pps: 2, 2
fade_start: 1
fade_end: 10
fade_target: 0
algorithm: bicubic

# Strain Gauge Z Offset Calibration (HX711 at front-left corner pad)
# Uses the load cell sensor independently from bltouch for Z offset only


[strain_gauge_z_cal]
sensor_type: hx711
dout_pin: PC6
sclk_pin: PA4
sample_rate: 80
gain: A-128
pad_x: 20
pad_y: 25
z_start_height: 5.0
z_min_position: -2.0
force_threshold: 20.0
trigger_force: 20       # Generic force trigger for diagnostics/safety testing
prtouch_trigger: True
prtouch_min_hold: 1000
prtouch_max_hold: 1500
tri_expand_mm: 0.07
step_size: 0.05
speed: 1.0
retract_dist: 2.0
clearance_z: 10.0
travel_speed: 80.0
target_probe_section: bltouch
counts_per_gram: 88.83
reference_tare_counts: 260114


# Explicit compatibility values from the validated V3 SE implementation.
tare_time: 0.10
force_safety_limit: 5000
prtouch_cal_min_hold: 1400
prtouch_cal_max_hold: 2000

# DEVELOPMENT TEST-MACHINE CALIBRATION:
# counts_per_gram and reference_tare_counts above are NOT yet
# established as universal Ender-3 V3 SE values.


[output_pin beeper]
pin: PB0


[tmc2209 stepper_x]
uart_pin: PB12
run_current: 0.60
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: false


[tmc2209 stepper_y]
uart_pin: PB13
run_current: 0.60
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: false


[tmc2209 stepper_z]
uart_pin: PB14
run_current: 0.8
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: false


[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100
