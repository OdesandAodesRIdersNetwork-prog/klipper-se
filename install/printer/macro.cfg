# Exact accepted live START_PRINT/END_PRINT macro body captured from read-only CB1 output.
[gcode_macro START_PRINT]
description: Ender-3 V3 SE print startup
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(params.BED|default(60))|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(params.HOTEND_TEMP|default(200)))|float %}
    {% set ABS_XYZ = printer.gcode_move.absolute_coordinates %}
    M220 S100
    M221 S100
    # Start heating
    M140 S{BED_TEMP}
    M104 S150
    # Home and load saved mesh
    G90
    G28
    BED_MESH_PROFILE LOAD=default
    # Finish heating
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    # Preserve slicer E state while Klipper performs its own purge
    SAVE_GCODE_STATE NAME=START_PRINT_STATE
    M83
    G1 Z2.0 F3000
    G1 X5 Y20 Z0.28 F5000
    G1 Y170 Z0.28 F1500 E15
    G1 X5.4 Y170 Z0.28 F5000
    G1 Y20 Z0.28 F1500 E15
    G1 Z2.0 F3000
    RESTORE_GCODE_STATE NAME=START_PRINT_STATE MOVE=0
    # G90 was required internally; restore slicer's XYZ mode if necessary
    {% if not ABS_XYZ %}
        G91
    {% endif %}
[gcode_macro END_PRINT]
description: Ender-3 V3 SE print shutdown
gcode:
    M400
    # END_PRINT controls its own extrusion mode
    M83
    {% if printer.extruder.can_extrude %}
        G1 E-2 F2700
    {% endif %}
    # Safe Z lift and present print
    {% if "xyz" in printer.toolhead.homed_axes %}
        {% set Z_NOW = printer.toolhead.position.z|float %}
        {% set Z_MAX = printer.toolhead.axis_maximum.z|float %}
        {% set Y_MAX = printer.toolhead.axis_maximum.y|float %}
        {% set Z_LIFT = [10.0, Z_MAX - Z_NOW]|min %}
        G91
        {% if Z_LIFT > 0 %}
            G1 Z{Z_LIFT} F600
        {% endif %}
        G90
        G1 X5 Y{Y_MAX} F6000
    {% endif %}
    TURN_OFF_HEATERS
    M107
    M84
